openapi: 3.0.3
info:
  title: Seller Panel API
  version: 0.1.0
  description: |
    Contract for auth, shop, categories, orders, dashboard, balance and the stock change (issues #10, #11, #51, #72, D5).
    Products are added with their feature.
    Errors are `{code, message}`. Lists take `page` and `page_size`.
    All money fields are integers in so'm (no floats).
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a seller with their shop and return a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Seller and shop created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered (`email_taken`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password and return a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token for the seller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Wrong email or password (`invalid_credentials`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /categories:
    get:
      tags: [Catalog]
      summary: The category tree as a flat list
      description: |
        Read only and the same for every seller. Top-level categories have `parent_id: null`.
        Each parent comes before its children.
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders:
    get:
      tags: [Orders]
      summary: List orders of the current shop
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get one order with its items
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/transition:
    post:
      tags: [Orders]
      summary: Move an order to the next status
      description: |
        Allowed transitions follow the status machine in docs/DOMAIN.md:
        `new → accepted → packed → handed_to_courier → delivered`, and `cancelled`
        from `new`, `accepted` or `packed`.
        - `accepted` reserves stock (fails with 409 `insufficient_stock` if available < quantity).
        - `cancelled` releases reserved stock and requires `reason`.
        - `delivered` deducts stock and writes `sale` and `commission` balance entries.
        Any other transition is rejected with 409 `invalid_transition`.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: The order after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Home page numbers for the current shop
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /balance:
    get:
      tags: [Balance]
      summary: Current balance of the shop
      description: |
        `available` is the sum of all balance entries (sale + commission + payout).
        Commission is 10% of each delivered order total.
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /balance/entries:
    get:
      tags: [Balance]
      summary: Balance history (newest first)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of balance entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceEntryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dev/simulate-order:
    post:
      tags: [Dev]
      summary: Create a random `new` order from the shop's active products
      description: Development only. Not available when the server runs in production mode (returns 404).
      responses:
        '201':
          description: The created order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /shop:
    get:
      tags: [Shop]
      summary: Get the current seller's shop profile
      responses:
        '200':
          description: The shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Shop]
      summary: Replace the shop profile
      description: |
        Replaces all editable fields. An empty optional field clears the stored value.
        The shop is taken from the token, never from the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopUpdate'
      responses:
        '200':
          description: The updated shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{id}/stock:
    patch:
      tags: [Stock]
      summary: Set the stock of a product from the product list
      description: |
        Rules are in docs/DECISIONS.md (D5).
        - `stock` is the new absolute quantity (0–1 000 000), so a retried request gives the same result.
        - `expected_stock` is the stock the seller saw; if it changed meanwhile, nothing is written (409 `stock_changed`).
        - `stock` cannot go below `reserved` (409 `stock_below_reserved`); archived products are refused (409 `product_archived`).
        - A product of another shop returns 404, the same as a missing one.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockUpdateRequest'
      responses:
        '200':
          description: The new stock level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLevel'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `stock_changed` (reload the product and try again), `stock_below_reserved` or `product_archived`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: stock_changed
                message: stock was changed since you opened it; reload and try again

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Category:
      type: object
      required: [id, name, parent_id]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: Null for a top-level category, two levels in total

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    RegisterRequest:
      type: object
      required: [email, password, shop_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: At most 72 bytes, bcrypt ignores the rest
        shop_name:
          type: string
          minLength: 1
          maxLength: 120

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: HS256 JWT carrying seller_id and shop_id, sent as `Authorization Bearer`
        expires_at:
          type: string
          format: date-time

    OrderStatus:
      type: string
      enum: [new, accepted, packed, handed_to_courier, delivered, cancelled]

    OrderItem:
      type: object
      required: [id, product_id, title, price, quantity]
      properties:
        id:
          type: string
        product_id:
          type: string
        title:
          type: string
          description: Title snapshot taken at order time
        price:
          type: integer
          description: Unit price snapshot in so'm
        quantity:
          type: integer
          minimum: 1

    Order:
      type: object
      required: [id, number, status, buyer_name, buyer_phone, delivery_address, items, total, created_at, status_changed_at]
      properties:
        id:
          type: string
        number:
          type: string
          example: '#100245'
        status:
          $ref: '#/components/schemas/OrderStatus'
        buyer_name:
          type: string
        buyer_phone:
          type: string
        delivery_address:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: integer
          description: Sum of price × quantity in so'm
        cancel_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        status_changed_at:
          type: string
          format: date-time

    OrderSummary:
      type: object
      description: Order without items, used in lists
      required: [id, number, status, buyer_name, total, created_at]
      properties:
        id:
          type: string
        number:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        buyer_name:
          type: string
        total:
          type: integer
        created_at:
          type: string
          format: date-time

    OrderPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    TransitionRequest:
      type: object
      required: [to]
      properties:
        to:
          $ref: '#/components/schemas/OrderStatus'
        reason:
          type: string
          minLength: 1
          description: Required when `to` is `cancelled`

    TopProduct:
      type: object
      required: [product_id, title, quantity_sold, revenue]
      properties:
        product_id:
          type: string
        title:
          type: string
        quantity_sold:
          type: integer
          description: Units in delivered orders in the last 30 days
        revenue:
          type: integer
          description: so'm

    DashboardSummary:
      type: object
      required: [today_orders, waiting_for_action, revenue_7d, revenue_30d, top_products]
      properties:
        today_orders:
          type: integer
          description: Orders created today
        waiting_for_action:
          type: integer
          description: Orders in status `new`
        revenue_7d:
          type: integer
          description: Sum of delivered order totals in the last 7 days, so'm
        revenue_30d:
          type: integer
          description: Sum of delivered order totals in the last 30 days, so'm
        top_products:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/TopProduct'

    Balance:
      type: object
      required: [available, earned, commission]
      properties:
        available:
          type: integer
          description: Sum of all balance entries, so'm
        earned:
          type: integer
          description: Sum of `sale` entries, so'm
        commission:
          type: integer
          description: Sum of `commission` entries (negative), so'm

    BalanceEntry:
      type: object
      required: [id, order_id, type, amount, created_at]
      properties:
        id:
          type: string
        order_id:
          type: string
        type:
          type: string
          enum: [sale, commission, payout]
        amount:
          type: integer
          description: Signed amount in so'm (sale > 0, commission < 0)
        created_at:
          type: string
          format: date-time

    BalanceEntryPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BalanceEntry'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    Shop:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 120
        logo_url:
          type: string
          nullable: true
          maxLength: 2048
        description:
          type: string
          maxLength: 2000
        contact_phone:
          type: string
          nullable: true
          example: '+998901234567'
        pickup_address:
          type: string
          nullable: true
          maxLength: 300

    ShopUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        logo_url:
          type: string
          maxLength: 2048
          description: http or https URL. Empty clears it.
        description:
          type: string
          maxLength: 2000
        contact_phone:
          type: string
          description: 7–15 digits with an optional leading +. Spaces, dashes and brackets are removed. Empty clears it.
        pickup_address:
          type: string
          maxLength: 300

    StockLabel:
      type: string
      enum: [in_stock, low_stock, out_of_stock]
      description: |
        `out_of_stock` when available is 0, `low_stock` when 0 < available ≤ LOW_STOCK_THRESHOLD (default 5),
        `in_stock` otherwise.

    StockUpdateRequest:
      type: object
      required: [stock, expected_stock]
      additionalProperties: false
      properties:
        stock:
          type: integer
          minimum: 0
          maximum: 1000000
          description: New absolute stock
        expected_stock:
          type: integer
          minimum: 0
          maximum: 1000000
          description: The stock the seller saw before editing
      example:
        stock: 12
        expected_stock: 10

    StockLevel:
      type: object
      required: [product_id, stock, reserved, available, stock_label, updated_at]
      properties:
        product_id:
          type: integer
          format: int64
        stock:
          type: integer
        reserved:
          type: integer
          description: Units promised to accepted orders
        available:
          type: integer
          description: stock − reserved
        stock_label:
          $ref: '#/components/schemas/StockLabel'
        updated_at:
          type: string
          format: date-time
          description: UTC
      example:
        product_id: 1
        stock: 7
        reserved: 3
        available: 4
        stock_label: low_stock
        updated_at: '2026-11-23T18:55:34Z'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_transition
        message:
          type: string

  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or not owned by the current shop
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Invalid request body (for example, missing `reason` on cancel)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        Business rule violated: `invalid_transition` or `insufficient_stock`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
