openapi: 3.0.3
info:
  title: Seller Panel API
  version: 0.1.0
  description: |
    Seller Panel API: sellers sign up with email and password, manage their shop and products,
    process orders, see their balance, and see the dashboard.

    **Auth.** `POST /auth/register` or `POST /auth/login` returns a JWT. Send it as
    `Authorization: Bearer <token>`. Every other endpoint needs it, and a seller only ever sees
    the data of their own shop.

    **Conventions.**
    - JSON with `snake_case` fields. Ids are integers. Money is an integer in so'm, never a float.
    - Errors are `{"code": "...", "message": "..."}`, also for unknown routes (`404 not_found`)
      and wrong methods (`405 method_not_allowed`, with an `Allow` header).
    - Lists take `page` and `page_size` (default 20) and return `items`, `page`, `page_size`, `total`.
      A `page_size` above 100 is lowered to 100 and a `page` below 1 becomes 1; a value that is not an integer is a 400.
    - An optional value that is not set is `null` when its column can be null (for example `logo_url`),
      and `""` for text that always has a value (for example a product `description`).
    - Any endpoint can answer `429 rate_limited` with a `Retry-After` header (seconds): per IP at the proxy,
      per shop on protected routes, and 5 failed logins per IP and email in 15 minutes.

    **Status.** Implemented: auth, shop, categories, products, stock, balance, orders, dashboard.
    `POST /dev/simulate-order` exists only when the backend runs with `APP_ENV=development` (the Docker
    Compose default); otherwise it answers 404 like any unknown route.
servers:
  - url: /api
    description: Through the proxy, the same address the app uses
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a seller with their shop and return a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Seller and shop created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          description: Email already registered (`email_taken`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password and return a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token for the seller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Wrong email or password (`invalid_credentials`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/request-code:
    post:
      tags: [Auth]
      summary: Send a sign-in code to the seller's linked Telegram chat
      description: |
        `202` when a code is sent. `409 telegram_not_linked` when the email is unknown or its seller has
        no linked chat, so no code can be sent. A code requested less than 60 seconds ago is not sent again
        and still answers `202`. The code is valid for 5 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCodeRequest'
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: No Telegram chat is linked to this email (`telegram_not_linked`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/TelegramUnavailable'

  /auth/verify:
    post:
      tags: [Auth]
      summary: Exchange a Telegram sign-in code for a token
      description: A code works once and stops working after 5 wrong attempts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Token for the seller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Code wrong, expired, used or locked (`invalid_code`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/telegram/link:
    post:
      tags: [Auth]
      summary: Create a one-time link that connects the seller's Telegram chat
      description: |
        Open the returned `url` in Telegram and press Start. The link is valid for 10 minutes and works once.
        Afterwards the seller gets sign-in codes in that chat. Re-linking replaces the chat.
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/TelegramUnavailable'

  /categories:
    get:
      tags: [Catalog]
      summary: The category tree as a flat list
      description: |
        Read only and the same for every seller. Top-level categories have `parent_id: null`.
        Each parent comes before its children.
      responses:
        '200':
          description: All categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders:
    get:
      tags: [Orders]
      summary: List orders of the current shop
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/events:
    get:
      tags: [Orders]
      summary: Stream new orders and status changes of the shop
      description: |
        Server-sent events (`text/event-stream`). Each event has an `event:` name and one `data:` line of JSON:
        - `order.created`: an order summary, the same shape as an item of `GET /orders`.
        - `order.status_changed`: a `StatusChange`.

        A comment line `: ping` arrives every 25 seconds. Nothing is replayed, so after a reconnect reload
        `GET /orders`. The stream ends when the token expires; open it again with a fresh token.
        At most 5 streams per shop, the next one gets `429 rate_limited` with `Retry-After`.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get one order with its items and status history
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/transition:
    post:
      tags: [Orders]
      summary: Move an order to the next status
      description: |
        Runs in one transaction: either the status and every side effect change, or nothing does.
        Allowed transitions follow the status machine in docs/DOMAIN.md:
        `new → accepted → packed → handed_to_courier → delivered`, and `cancelled`
        from `new`, `accepted` or `packed`.
        - `accepted` reserves stock (fails with 409 `insufficient_stock` if available < quantity).
        - `cancelled` releases reserved stock and requires `reason`.
        - `delivered` deducts stock and writes `sale` and `commission` balance entries.
        Any other transition is rejected with 409 `invalid_transition`.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: The order after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Home page numbers for the current shop
      description: |
        Days are calendar days in the business time zone (`BUSINESS_TIMEZONE`, `Asia/Tashkent` by default),
        not in UTC. "Today" runs from 00:00 to 24:00 in that zone, "last 7 days" is today and the 6 days
        before it, and "last 30 days" is today and the 29 days before it.

        - `today_orders`: orders created today, in any status.
        - `waiting_for_action`: orders in `new`, `accepted` or `packed`, whatever their age.
        - `revenue_7d`, `revenue_30d`: sum of the `total` of orders that became `delivered` in the window,
          before commission. Cancelled orders never count.
        - `top_products`: up to 5 products by units in orders delivered in the last 30 days, most units first,
          then most revenue, then lowest `product_id`. `title` is the current title of the product.

        A shop with no orders gets zeros and `top_products: []`, not 404. Rules are in docs/DECISIONS.md (D10).
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
              examples:
                shopWithSales:
                  summary: A shop with orders
                  value:
                    today_orders: 4
                    waiting_for_action: 2
                    revenue_7d: 4500000
                    revenue_30d: 12000000
                    top_products:
                      - product_id: 12
                        title: Phone Pro
                        quantity_sold: 5
                        revenue: 7500000
                      - product_id: 7
                        title: Phone case
                        quantity_sold: 3
                        revenue: 150000
                newShop:
                  summary: A shop without orders
                  value:
                    today_orders: 0
                    waiting_for_action: 0
                    revenue_7d: 0
                    revenue_30d: 0
                    top_products: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /balance:
    get:
      tags: [Balance]
      summary: Current balance of the shop
      description: |
        `available` is the sum of all balance entries (sale + commission + payout).
        Commission is `COMMISSION_PERCENT` (10 by default) of each delivered order total.
        A shop with no entries gets zeros. Rules are in docs/DECISIONS.md (D7).
      responses:
        '200':
          description: Balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /balance/entries:
    get:
      tags: [Balance]
      summary: Balance history (newest first)
      description: |
        Entries are ordered by `created_at`, then `id`, newest first. `page_size` above 100 is
        lowered to 100. A `page` above 1 000 000 or a value that is not an integer is a 400.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of balance entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceEntryPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dev/simulate-order:
    post:
      tags: [Dev]
      summary: Create a random `new` order from the shop's active products
      description: |
        Development only, there is no buyer app, so this stands in for one. It picks 1 to 3 of the shop's
        active products that have available stock, a quantity of at most 3 (and at most what is available)
        for each, and a fake buyer. It does not reserve stock: accepting the order does.
        Not available when `APP_ENV` is `production`: the route does not exist and the answer is 404.
      responses:
        '201':
          description: The created order, with its first history row (from `null` to `new`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The shop has no active product with available stock (`no_products_to_order`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /shop:
    get:
      tags: [Shop]
      summary: Get the current seller's shop profile
      responses:
        '200':
          description: The shop
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Shop]
      summary: Replace the shop profile and change the logo
      description: |
        Replaces all editable fields. An empty optional field clears the stored value.
        The shop is taken from the token, never from the request.

        Two request formats:
        - `application/json`: the fields only, the logo does not change.
        - `multipart/form-data`: the same fields as form fields, plus a logo image in the field `logo`
          (jpeg, png or webp, 5 MB). Without it the logo stays. A logo can be replaced, not removed.

        The profile and the logo are saved together: when anything fails nothing changes and no file stays on
        the server; the old logo file is deleted once the new one is saved. The image type is checked from the file
        content, not from its name or `Content-Type`; it is turned upright (EXIF orientation), scaled to at most
        2048 px on the longest side and stored as WebP, so all metadata (EXIF, GPS) is dropped. The file is public:
        the `logo_url` opens in a browser without a token, nginx serves it straight from the uploads volume.
        A request with a logo counts against a per shop limit of 20 a minute by default (`RATE_LIMIT_IMAGES_PER_MINUTE`);
        a JSON request does not. `logo_url` is not an input, the server writes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShopForm'
            encoding:
              logo:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: The updated shop, `logo_url` is the URL of the stored logo or `null`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          description: |
            Invalid field, an unknown or repeated form field, an empty file or a file that is not a decodable image
            (`validation_error`); a body that is not valid JSON or multipart (`invalid_body`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: The logo is larger than 5 MB (`file_too_large`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The logo is not jpeg, png or webp (`unsupported_media_type`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Too many images are being processed (`busy`), retry after the seconds in `Retry-After`
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products:
    get:
      tags: [Products]
      summary: List the products of the current shop, newest first
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Case-insensitive search in title and SKU
        - name: category
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Products of this category and of all its subcategories
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Products]
      summary: Create a product in the current shop, with its photos
      description: |
        A new product always starts as a `draft`; its status is changed afterwards (`status` of `PUT /products/{id}`, `POST /products/{id}/archive`).

        The body is `multipart/form-data`: the fields as form fields plus 1 to 5 images in the field `photos`
        (jpeg, png or webp, 5 MB each). The first image is the cover. A product needs at least one photo, so a
        JSON body is answered with `validation_error`.

        The product and its photos are saved together: when anything fails (a bad field, a file that is not an
        image, a taken SKU) nothing is created and no file stays on the server. The image type is checked from
        the file content, not from its name or `Content-Type`; each image is turned upright (EXIF orientation),
        scaled to at most 2048 px on the longest side and stored as WebP, so all metadata (EXIF, GPS) is dropped.
        The files are public: a photo URL opens in a browser without a token, nginx serves it straight from the
        uploads volume. Every create counts against a per shop limit of 20 a minute by default
        (`RATE_LIMIT_IMAGES_PER_MINUTE`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateProductForm'
            encoding:
              photos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: The created product, `photos` has the URLs of the stored images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: |
            Invalid field, an unknown or repeated form field, no photo or more than 5, an empty file or a file that is not
            a decodable image (`validation_error`); a body that is not valid JSON or multipart (`invalid_body`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: SKU already used in this shop (`sku_taken`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: A photo is larger than 5 MB (`file_too_large`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: A file is not jpeg, png or webp (`unsupported_media_type`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Too many images are being processed (`busy`), retry after the seconds in `Retry-After`
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{id}:
    get:
      tags: [Products]
      summary: Get one product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Replace the editable fields and change the photos of a product
      description: |
        Does not change `stock` or `reserved`, use `PATCH /products/{id}/stock` for that.
        Archived products cannot be edited.

        Two formats: `application/json` never touches the photos, a `multipart/form-data` request changes them:
        `keep_photos` (repeat the field) lists the current photo URLs that stay, in the order wanted, and new images
        in `photos` are added after them. Without `keep_photos` every current photo stays; an empty `keep_photos`
        drops them all, which needs new images in `photos`. 1 to 5 photos in the end, so a product that has no photo
        yet gets one with its next edit.

        All or nothing: when the update fails, the old photos stay and the new files are removed. Photos that are
        no longer listed are deleted from the server once the product is saved.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProductForm'
            encoding:
              photos:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: The updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: |
            Invalid field, an unknown or repeated form field, a `keep_photos` URL that is not a current photo of
            this product, no photo or more than 5 in the end, or a file that is not a decodable image (`validation_error`);
            a body that is not valid JSON or multipart (`invalid_body`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`sku_taken` or `product_archived`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: A photo is larger than 5 MB (`file_too_large`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: A file is not jpeg, png or webp (`unsupported_media_type`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Too many images are being processed (`busy`), retry after the seconds in `Retry-After`
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{id}/archive:
    post:
      tags: [Products]
      summary: Archive a product
      description: Hides it from new orders and keeps its history. Archiving an archived product returns it unchanged.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The archived product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /products/{id}/stock:
    patch:
      tags: [Stock]
      summary: Set the stock of a product from the product list
      description: |
        Rules are in docs/DECISIONS.md (D5).
        - `stock` is the new absolute quantity (0–1 000 000), so a retried request gives the same result.
        - `expected_stock` is the stock the seller saw; if it changed meanwhile, nothing is written (409 `stock_changed`).
        - `stock` cannot go below `reserved` (409 `stock_below_reserved`); archived products are refused (409 `product_archived`).
        - A product of another shop returns 404, the same as a missing one.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockUpdateRequest'
      responses:
        '200':
          description: The product with its new stock, the same shape as every other product endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `stock_changed` (reload the product and try again), `stock_below_reserved` or `product_archived`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: stock_changed
                message: stock was changed since you opened it; reload and try again

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Category:
      type: object
      required: [id, name, parent_id]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        parent_id:
          type: integer
          format: int64
          nullable: true
          description: Null for a top-level category, two levels in total

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    RegisterRequest:
      type: object
      required: [email, password, shop_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: |
            Spaces around the password are dropped, here and at login, before the length is checked. At most
            72 bytes, bcrypt ignores the rest.
        shop_name:
          type: string
          minLength: 1
          maxLength: 120

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RequestCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    VerifyRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
          example: '491806'

    Accepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [sent]

    TelegramLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
          example: https://t.me/seller_panel_bot?start=Qx1bH3lVt0a5Wk8oP2yZcA
        expires_at:
          type: string
          format: date-time

    TokenResponse:
      type: object
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: HS256 JWT carrying seller_id and shop_id, sent as `Authorization Bearer`
        expires_at:
          type: string
          format: date-time

    OrderStatus:
      type: string
      enum: [new, accepted, packed, handed_to_courier, delivered, cancelled]

    OrderItem:
      type: object
      required: [id, product_id, title, price, quantity]
      properties:
        id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        title:
          type: string
          description: Title snapshot taken at order time
        price:
          type: integer
          description: Unit price snapshot in so'm
        quantity:
          type: integer
          minimum: 1

    Order:
      type: object
      required: [id, number, status, buyer_name, buyer_phone, delivery_address, items, total, created_at, status_changed_at, history]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
          example: '#100245'
        status:
          $ref: '#/components/schemas/OrderStatus'
        buyer_name:
          type: string
        buyer_phone:
          type: string
        delivery_address:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: integer
          description: Sum of price × quantity in so'm
        cancel_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        status_changed_at:
          type: string
          format: date-time
        history:
          type: array
          description: |
            Every status change, oldest first. An order created by the dev endpoint starts with one row
            from `null` to `new`; orders that were inserted some other way can have no rows yet.
          items:
            $ref: '#/components/schemas/OrderHistoryEntry'

    OrderHistoryEntry:
      type: object
      required: [from_status, to_status, reason, created_at]
      properties:
        from_status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
          nullable: true
        to_status:
          $ref: '#/components/schemas/OrderStatus'
        reason:
          type: string
          nullable: true
          description: The cancel reason, null for other changes
        created_at:
          type: string
          format: date-time

    StatusChange:
      type: object
      description: Data of the `order.status_changed` event
      required: [id, number, status, status_changed_at]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
          example: '#100245'
        status:
          $ref: '#/components/schemas/OrderStatus'
        status_changed_at:
          type: string
          format: date-time

    OrderSummary:
      type: object
      description: Order without items, used in lists
      required: [id, number, status, buyer_name, total, created_at]
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        buyer_name:
          type: string
        total:
          type: integer
        created_at:
          type: string
          format: date-time

    OrderPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    TransitionRequest:
      type: object
      required: [to]
      properties:
        to:
          $ref: '#/components/schemas/OrderStatus'
        reason:
          type: string
          minLength: 1
          description: Required when `to` is `cancelled`

    TopProduct:
      type: object
      required: [product_id, title, quantity_sold, revenue]
      properties:
        product_id:
          type: integer
          format: int64
        title:
          type: string
          description: Current title of the product
        quantity_sold:
          type: integer
          format: int64
          description: Units in orders delivered in the last 30 days
        revenue:
          type: integer
          format: int64
          description: Sum of price at the time of the order times quantity for those units, so'm

    DashboardSummary:
      type: object
      required: [today_orders, waiting_for_action, revenue_7d, revenue_30d, top_products]
      properties:
        today_orders:
          type: integer
          description: Orders created today in the business time zone, in any status
        waiting_for_action:
          type: integer
          description: Orders the seller still has to act on, in status `new`, `accepted` or `packed`
        revenue_7d:
          type: integer
          format: int64
          description: Sum of delivered order totals in the last 7 days (today and 6 days before), so'm
        revenue_30d:
          type: integer
          format: int64
          description: Sum of delivered order totals in the last 30 days (today and 29 days before), so'm
        top_products:
          type: array
          maxItems: 5
          description: Best sellers of the last 30 days; `[]` when nothing was delivered
          items:
            $ref: '#/components/schemas/TopProduct'

    Balance:
      type: object
      required: [available, earned, commission]
      properties:
        available:
          type: integer
          description: Sum of all balance entries, so'm
        earned:
          type: integer
          description: Sum of `sale` entries, so'm
        commission:
          type: integer
          description: Sum of `commission` entries (negative), so'm

    BalanceEntry:
      type: object
      required: [id, order_id, type, amount, created_at]
      properties:
        id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
          nullable: true
          description: The order the money belongs to; null for a payout
        type:
          type: string
          enum: [sale, commission, payout]
        amount:
          type: integer
          format: int64
          description: Signed amount in so'm (sale > 0, commission <= 0, payout < 0)
        created_at:
          type: string
          format: date-time

    BalanceEntryPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BalanceEntry'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    Shop:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 120
        logo_url:
          type: string
          nullable: true
          maxLength: 2048
          description: URL of the stored logo, `null` when there is none. Set with `PUT /shop` (multipart).
        description:
          type: string
          maxLength: 2000
        contact_phone:
          type: string
          nullable: true
          example: '+998901234567'
        pickup_address:
          type: string
          nullable: true
          maxLength: 300

    ShopUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        contact_phone:
          type: string
          description: 7–15 digits with an optional leading +. Spaces, dashes and brackets are removed. Empty clears it.
        pickup_address:
          type: string
          maxLength: 300

    ShopForm:
      type: object
      required: [name]
      description: The fields of `ShopUpdate` as form fields, plus the logo.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        contact_phone:
          type: string
          description: 7–15 digits with an optional leading +. Spaces, dashes and brackets are removed. Empty clears it.
        pickup_address:
          type: string
          maxLength: 300
        logo:
          type: string
          format: binary
          description: A new logo image (jpeg, png or webp, 5 MB). It replaces the current one.

    ProductStatus:
      type: string
      enum: [draft, active, archived]

    Product:
      type: object
      required: [id, shop_id, category_id, title, description, price, sku, stock, reserved, status, photos, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        shop_id:
          type: integer
          format: int64
        category_id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        price:
          type: integer
          format: int64
          description: so'm
        sku:
          type: string
        stock:
          type: integer
        reserved:
          type: integer
        status:
          $ref: '#/components/schemas/ProductStatus'
          description: A new product is a `draft`.
        photos:
          $ref: '#/components/schemas/ProductPhotos'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductPhotos:
      type: array
      maxItems: 5
      items:
        type: string
      description: |
        URLs of the product's photos, the first one is the cover. Open them directly (no token), for example
        `/api/uploads/12/3f2a9c4e8b1d4f6a9e0c7b5d2a1f8e34.webp`. `[]` when there are none.
      example: ['/api/uploads/12/3f2a9c4e8b1d4f6a9e0c7b5d2a1f8e34.webp']

    UpdateProductRequest:
      type: object
      required: [category_id, title, price, sku]
      additionalProperties: false
      properties:
        category_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        price:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        sku:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum: [draft, active]
          description: Kept as is when omitted

    CreateProductForm:
      type: object
      required: [category_id, title, price, sku, photos]
      description: The fields of a new product and its images.
      properties:
        category_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        price:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        sku:
          type: string
          minLength: 1
          maxLength: 64
        stock:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
        photos:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: binary
          description: Images (jpeg, png or webp, 5 MB each). The first one is the cover.

    UpdateProductForm:
      type: object
      required: [category_id, title, price, sku]
      description: The fields of `UpdateProductRequest` as form fields, plus the photo changes.
      properties:
        category_id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        price:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
        sku:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum: [draft, active]
          description: Kept as is when omitted
        keep_photos:
          type: array
          items:
            type: string
          description: |
            Current photo URLs that stay, in the order wanted. Omit the field to keep all of them,
            send it empty to remove them all.
        photos:
          type: array
          items:
            type: string
            format: binary
          description: New images, added after the kept photos. At most 5 photos in the end.

    ProductPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    StockUpdateRequest:
      type: object
      required: [stock, expected_stock]
      additionalProperties: false
      properties:
        stock:
          type: integer
          minimum: 0
          maximum: 1000000
          description: New absolute stock
        expected_stock:
          type: integer
          minimum: 0
          maximum: 1000000
          description: The stock the seller saw before editing
      example:
        stock: 12
        expected_stock: 10

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: invalid_transition
        message:
          type: string

  responses:
    TooManyRequests:
      description: Rate limit reached (`rate_limited`), retry after the number of seconds in `Retry-After`
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid or expired token, or the seller and shop in it no longer exist (sign in again)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found, or not owned by the current shop
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Invalid request body (for example, missing `reason` on cancel)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TelegramUnavailable:
      description: Sign-in by Telegram code is not set up on this server (`telegram_unavailable`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        Business rule violated: `invalid_transition`, `insufficient_stock`, or `product_not_found`
        (a product of the order no longer exists).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
