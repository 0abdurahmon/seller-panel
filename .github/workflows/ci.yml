name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seller
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: seller_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seller -d seller_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://seller:ci-password@localhost:5432/seller_test?sslmode=disable
      COVERAGE_MIN: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify modules
        run: go mod verify
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet -tags e2e ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend
          args: --build-tags=e2e --timeout=5m
      - name: Test with the race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: End-to-end tests
        run: go test -race -count=1 -tags e2e ./e2e/...
      - name: Coverage
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')"
          echo "Total coverage: ${total}% (minimum ${COVERAGE_MIN}%)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v total="$total" -v min="$COVERAGE_MIN" 'BEGIN { exit !(total + 0 >= min + 0) }'
      - name: Build
        run: go build ./...

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: backend/go.sum
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate compose file
        run: docker compose config -q
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait for healthchecks
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: sh scripts/smoke.sh
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
