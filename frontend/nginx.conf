map $uri $auth_limit_key {
  default "";
  ~^/api/auth/ $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=api_global:10m rate=10r/s;
limit_req_zone $auth_limit_key zone=api_auth:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 6m;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  error_page 429 = @rate_limited;

  location @rate_limited {
    default_type application/json;
    add_header Retry-After "10" always;
    include /etc/nginx/snippets/security-headers.conf;
    return 429 '{"code":"rate_limited","message":"too many requests, try again later"}';
  }

  location /api/ {
    limit_req zone=api_global burst=30 nodelay;
    limit_req zone=api_auth burst=5 nodelay;
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /docs {
    absolute_redirect off;
    return 301 /docs/;
  }

  location = /swagger {
    include /etc/nginx/snippets/spec-proxy.conf;
  }

  location = /docs/spec/openapi.json {
    include /etc/nginx/snippets/spec-proxy.conf;
  }

  location /docs/ {
    index index.html;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
